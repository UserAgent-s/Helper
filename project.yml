name: UserAgent057
options:
  bundleIdPrefix: com.local
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

settingGroups:
  versioning:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

packages:
  UserAgent057Core:
    path: .

targets:
  UserAgent057:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Sources/App
      - path: Sources/OverlayUI
      - path: Sources/HistoryUI
      - path: Resources/Localizable.xcstrings
      - path: Resources/Assets.xcassets
    settings:
      groups:
        - versioning
      base:
        SWIFT_VERSION: "6.0"
        PRODUCT_BUNDLE_IDENTIFIER: com.local.UserAgent057
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Resources/UserAgent057.entitlements
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: YES
        SWIFT_STRICT_CONCURRENCY: complete
        ARCHS: arm64
        VALID_ARCHS: arm64
        ONLY_ACTIVE_ARCH: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
          ONLY_ACTIVE_ARCH: YES
        Release:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: RELEASE
          ONLY_ACTIVE_ARCH: NO
          SWIFT_COMPILATION_MODE: wholemodule
    dependencies:
      - package: UserAgent057Core
        product: Domain
      - package: UserAgent057Core
        product: AudioCapture
      - package: UserAgent057Core
        product: RealtimeClient
      - package: UserAgent057Core
        product: Transcription
      - package: UserAgent057Core
        product: Persistence
      - package: UserAgent057Core
        product: SecurityStore
      - package: UserAgent057Core
        product: Diagnostics
      - package: UserAgent057Core
        product: Summary
      - package: UserAgent057Core
        product: OverlayReducer
      - package: UserAgent057Core
        product: CompanionProtocol
      - package: UserAgent057Core
        product: CompanionServer
      - package: UserAgent057Core
        product: CompanionBridge

  UserAgent057Tests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Tests/AppTests
    settings:
      base:
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: UserAgent057

schemes:
  UserAgent057:
    build:
      targets:
        UserAgent057: all
        UserAgent057Tests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - UserAgent057Tests
    archive:
      config: Release

  UserAgent057Tests:
    build:
      targets:
        UserAgent057Tests: all
    test:
      config: Debug
      targets:
        - UserAgent057Tests
